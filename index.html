<style>html,body{margin:0;height:100%;overflow:hidden;background:#2d5a27;touch-action:none;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif}

<canvas id="c"></canvas><div id="ui"></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),UI=document.getElementById('ui');
const WORLD=1000,CX=500,CY=500,CASTLE_R=30,WALL_R=105,TAU=Math.PI*2;
let W,H,D,Z;function rs(){D=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;C.style.width=W+'px';C.style.height=H+'px';Z=Math.max(1.6,Math.min(4,Math.min(W,H)/180))}
addEventListener('resize',rs);rs();
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
['gesturestart','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
let best=+(localStorage.getItem('kaBest')||0),st=null,state='menu';
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
// floating joystick
const JR=55;let joy=null;
C.addEventListener('pointerdown',e=>{joy={id:e.pointerId,bx:e.clientX,by:e.clientY,x:e.clientX,y:e.clientY}});
C.addEventListener('pointermove',e=>{if(!joy||joy.id!==e.pointerId)return;joy.x=e.clientX;joy.y=e.clientY;const dx=joy.x-joy.bx,dy=joy.y-joy.by,m=Math.hypot(dx,dy);if(m>JR){joy.bx=joy.x-dx/m*JR;joy.by=joy.y-dy/m*JR}});
['pointerup','pointercancel'].forEach(t=>C.addEventListener(t,e=>{if(joy&&joy.id===e.pointerId)joy=null}));
// background
const bg=document.createElement('canvas');bg.width=bg.height=WORLD*2;
(function(){const g=bg.getContext('2d');g.scale(2,2);g.fillStyle='#62b544';g.fillRect(0,0,WORLD,WORLD);
for(let i=0;i<500;i++){g.fillStyle=R()<.5?'rgba(255,255,160,.06)':'rgba(0,60,0,.07)';g.beginPath();g.arc(R()*WORLD,R()*WORLD,rnd(15,60),0,TAU);g.fill()}
const onPath=(x,y)=>Math.abs(x-CX)<16||Math.abs(y-CY)<16;
g.lineCap='round';[[CX,0],[CX,WORLD],[0,CY],[WORLD,CY]].forEach(([x,y])=>{[[30,'#a8834e'],[24,'#d4b27a'],[14,'#dcbd88']].forEach(([w,c])=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(CX,CY);g.lineTo(x,y);g.stroke()})});
for(let i=0;i<400;i++){const x=R()*WORLD,y=R()*WORLD;if(!onPath(x,y)||dist(x,y,CX,CY)<60)continue;g.fillStyle='rgba(120,90,50,.35)';g.beginPath();g.arc(x,y,rnd(.6,1.6),0,TAU);g.fill()}
g.fillStyle='#bfa77c';g.beginPath();g.arc(CX,CY,52,0,TAU);g.fill();g.strokeStyle='#9c8660';g.lineWidth=2;g.stroke();
for(let i=0;i<120;i++){const a=R()*TAU,r=R()*50;g.strokeStyle='rgba(90,75,50,.4)';g.lineWidth=.6;g.strokeRect(CX+Math.cos(a)*r-3,CY+Math.sin(a)*r-2,6,4)}
for(let i=0;i<5000;i++){const x=R()*WORLD,y=R()*WORLD;if(onPath(x,y)||dist(x,y,CX,CY)<56)continue;g.strokeStyle=R()<.5?'#3f8f2c':'#7cd156';g.lineWidth=.8;g.beginPath();for(let j=-1;j<=1;j++){g.moveTo(x+j*1.2,y);g.lineTo(x+j*2,y-rnd(2,4))}g.stroke()}
for(let i=0;i<700;i++){const x=R()*WORLD,y=R()*WORLD;if(onPath(x,y)||dist(x,y,CX,CY)<60)continue;g.fillStyle=['#fff','#ffe14d','#ff8ac9','#b9a0ff'][i%4];for(let j=0;j<4;j++){g.beginPath();g.arc(x+Math.cos(j*1.57)*1.3,y+Math.sin(j*1.57)*1.3,1,0,TAU);g.fill()}g.fillStyle='#ffb300';g.beginPath();g.arc(x,y,.7,0,TAU);g.fill()}
const deco=[];for(let i=0;i<260;i++){const x=R()*WORLD,y=R()*WORLD;if(onPath(x,y)||Math.abs(x-CX)<34||Math.abs(y-CY)<34||dist(x,y,CX,CY)<190)continue;deco.push([x,y,R()<.75])}
deco.sort((a,b)=>a[1]-b[1]).forEach(([x,y,t])=>{g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.ellipse(x+3,y+1,t?13:8,t?5:3,0,0,TAU);g.fill();
if(t){g.fillStyle='#6d4422';g.fillRect(x-2,y-10,4,11);[['#2e7a24',0,-18,11],['#3c9a2e',-3,-21,8],['#5bbf3f',-4,-24,4]].forEach(([c,dx,dy,r])=>{g.fillStyle=c;g.beginPath();g.arc(x+dx,y+dy,r,0,TAU);g.arc(x+dx+7,y+dy+3,r*.8,0,TAU);g.arc(x+dx-6,y+dy+3,r*.8,0,TAU);g.fill()})}
else{g.fillStyle='#8a8f96';g.beginPath();g.ellipse(x,y-3,8,5,0,0,TAU);g.fill();g.fillStyle='#b3b8bf';g.beginPath();g.ellipse(x-2,y-5,4,2.5,0,0,TAU);g.fill()}})})();
// pads
function makePads(){const p=[];const inner=[['wall','🧱','Walls',4],['barracks','⚔️','Barracks',4],['bow','🏹','Damage',15],['multi','🎯','Multi-shot',5],['rate','⚡','Fire rate',10],['horse','🐎','Horse',6],['repair','🔧','Repair',99]];
inner.forEach((d,i)=>{const a=-Math.PI/2+i*TAU/inner.length+.2;p.push({kind:d[0],icon:d[1],name:d[2],max:d[3],lv:0,paid:0,x:CX+Math.cos(a)*72,y:CY+Math.sin(a)*72+6,lock:false})});
[45,135,225,315].forEach(a=>{a*=Math.PI/180;p.push({kind:'tower',icon:'🗼',name:'Tower',max:5,lv:0,paid:0,x:CX+Math.cos(a)*140,y:CY+Math.sin(a)*140,lock:false,cd:0})});return p}
function cost(p){const l=p.lv;return{wall:40+l*50,barracks:60+l*60,bow:15+l*20,multi:60+l*80,rate:20+l*25,horse:20+l*25,repair:25,tower:30+l*45}[p.kind]}
function newGame(){st={wave:0,gold:30,spawnLeft:0,spawnT:0,boss:false,breakT:4,k:{x:CX,y:CY+45,vx:0,vy:0,hp:100,mhp:100,cd:0,face:1,ph:0,fl:0},
cam:{x:CX,y:CY+45},castle:{hp:300,mhp:300},wall:{hp:0,mhp:0},dmg:8,rate:1.5,multi:1,spd:75,pads:makePads(),en:[],ar:[],coins:[],pt:[],nums:[],hud:[],sol:[],solT:0,pops:[],shake:0};state='play';UI.style.display='none'}
const P=k=>st.pads.find(p=>p.kind===k);
function startWave(){st.wave++;st.spawnLeft=5+st.wave*3;st.boss=st.wave%5===0;st.spawnT=0;pop(st.boss?'👹 BOSS WAVE '+st.wave:'WAVE '+st.wave,st.boss?'#ff5252':'#fff')}
function pop(t,c='#ffd740'){st.pops.push({t,c,a:0})}
function spawn(type){const a=R()*TAU,x=Math.max(10,Math.min(WORLD-10,CX+Math.cos(a)*520)),y=Math.max(10,Math.min(WORLD-10,CY+Math.sin(a)*520)),w=st.wave;
const T={gob:{hp:12+w*5,sp:30+w*1.2,r:5,dmg:4,g:1},orc:{hp:40+w*14,sp:20+w*.6,r:8,dmg:10,g:3},boss:{hp:300+w*100,sp:15,r:16,dmg:30,g:30}}[type];
st.en.push({type,x,y,hp:T.hp,mhp:T.hp,sp:T.sp,r:T.r,dmg:T.dmg,g:T.g,ac:0,ph:R()*6,fl:0,face:1})}
function nearest(x,y,max){let b=null,bd=max;for(const e of st.en){const d=dist(e.x,e.y,x,y);if(d<bd){bd=d;b=e}}return b}
function shoot(x,y,t,dmg,n,sp=260){const a=Math.atan2(t.y-6-y,t.x-x);for(let i=0;i<n;i++){const o=(i-(n-1)/2)*.14;st.ar.push({x,y,vx:Math.cos(a+o)*sp,vy:Math.sin(a+o)*sp,dmg,l:.8})}}
function burst(x,y,c,n=6,s=60){for(let i=0;i<n;i++){const a=R()*TAU,v=R()*s;st.pt.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.5,ml:.5,c,s:rnd(1,2.2)})}}
function num(x,y,t,c='#fff',s=7){st.nums.push({x,y,t,c,l:.8,s})}
function hit(e,d){e.hp-=d;e.fl=.1;num(e.x+rnd(-3,3),e.y-e.r*2-4,Math.round(d),'#fff');burst(e.x,e.y-e.r,'#fff',3,40)}
function applyUp(p){const s=st;switch(p.kind){case'bow':s.dmg+=4;break;case'multi':s.multi++;break;case'rate':s.rate+=.25;break;case'horse':s.spd+=10;break;
case'wall':s.wall.mhp=150*p.lv;s.wall.hp=s.wall.mhp;break;case'repair':p.lv=0;s.castle.hp=s.castle.mhp;s.wall.hp=s.wall.mhp;s.k.hp=s.k.mhp;break;case'tower':break;case'barracks':break}
for(let i=0;i<30;i++){const a=i/30*TAU;st.pt.push({x:p.x,y:p.y,vx:Math.cos(a)*80,vy:Math.sin(a)*80,l:.6,ml:.6,c:'#ffd740',s:2.2})}
pop(p.kind==='repair'?'REPAIRED!':'UPGRADE!');num(p.x,p.y-24,p.name+(p.kind==='repair'?'':' Lv'+p.lv),'#ffd740',8);st.shake=.25}
function upd(dt){const s=st,k=s.k;
// input
let ix=0,iy=0;if(joy){ix=(joy.x-joy.bx)/JR;iy=(joy.y-joy.by)/JR}ix+=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);iy+=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
let m=Math.hypot(ix,iy);if(m<.15){ix=iy=0}else if(m>1){ix/=m;iy/=m}
const f=Math.min(1,dt*(m>.15?7:9));k.vx+=(ix*s.spd-k.vx)*f;k.vy+=(iy*s.spd-k.vy)*f;
k.x=Math.max(8,Math.min(WORLD-8,k.x+k.vx*dt));k.y=Math.max(8,Math.min(WORLD-8,k.y+k.vy*dt));
const sp=Math.hypot(k.vx,k.vy);if(Math.abs(k.vx)>4)k.face=k.vx<0?-1:1;k.ph+=sp*dt*.22;k.fl-=dt;
if(dist(k.x,k.y,CX,CY)<WALL_R)k.hp=Math.min(k.mhp,k.hp+4*dt);
// camera
const hw=W/2/Z,hh=H/2/Z;s.cam.x+=(k.x+k.vx*.3-s.cam.x)*Math.min(1,dt*4);s.cam.y+=(k.y+k.vy*.3-s.cam.y)*Math.min(1,dt*4);
s.cam.x=Math.max(hw,Math.min(WORLD-hw,s.cam.x));s.cam.y=Math.max(hh,Math.min(WORLD-hh,s.cam.y));s.shake=Math.max(0,s.shake-dt);
// waves
if(s.breakT>0){s.breakT-=dt;if(s.breakT<=0)startWave()}else{
if(s.spawnLeft>0){s.spawnT-=dt;if(s.spawnT<=0){s.spawnLeft--;spawn(s.wave>=3&&R()<Math.min(.45,.1+s.wave*.03)?'orc':'gob');s.spawnT=Math.max(.3,1.2-s.wave*.05)}}
if(s.boss&&s.spawnLeft===0){spawn('boss');s.boss=false}
if(s.spawnLeft===0&&!s.boss&&s.en.length===0){s.breakT=8;pop('WAVE '+s.wave+' CLEARED!','#69f0ae')}}
// king shooting
k.cd-=dt;if(k.cd<=0){const t=nearest(k.x,k.y,120);if(t){shoot(k.x,k.y-14,t,s.dmg,s.multi);k.cd=1/s.rate}}
// pads
for(const p of s.pads){const on=dist(k.x,k.y,p.x,p.y)<14;if(!on){p.lock=false;continue}if(p.lock||p.lv>=p.max)continue;
if(p.kind==='repair'&&s.castle.hp>=s.castle.mhp&&s.wall.hp>=s.wall.mhp&&k.hp>=k.mhp)continue;
const c=cost(p),pay=Math.min(c*dt/1.1,s.gold,c-p.paid);if(pay>0){s.gold-=pay;p.paid+=pay;if(R()<.4)s.pt.push({x:k.x,y:k.y-10,vx:(p.x-k.x)*3,vy:(p.y-k.y)*3-20,l:.3,ml:.3,c:'#ffd740',s:2})}
if(p.paid>=c-1e-6){p.paid=0;p.lv++;p.lock=true;applyUp(p)}}
// towers
for(const p of s.pads)if(p.kind==='tower'&&p.lv){p.cd-=dt;if(p.cd<=0){const t=nearest(p.x,p.y,90+p.lv*15);if(t){shoot(p.x,p.y-20-p.lv*5,t,5+p.lv*5,p.lv>=4?2:1,300);p.cd=1.1/(1+p.lv*.25)}}}
// soldiers
const bar=P('barracks');if(bar.lv){s.solT-=dt;if(s.solT<=0&&s.sol.length<bar.lv*2){s.sol.push({x:bar.x,y:bar.y,hp:40+bar.lv*15,mhp:40+bar.lv*15,cd:0,ph:0,fl:0,face:1});s.solT=5}}
for(const o of s.sol){o.fl-=dt;o.cd-=dt;let t=null,bd=1e9;for(const e of s.en){const d=dist(e.x,e.y,o.x,o.y);if(d<bd&&dist(e.x,e.y,CX,CY)<200){bd=d;t=e}}
const tx=t?t.x:bar.x+rnd(-1,1),ty=t?t.y:bar.y+12,d=dist(o.x,o.y,tx,ty);
if(t&&d<t.r+6){if(o.cd<=0){hit(t,6+bar.lv*3);o.cd=.8}}else if(d>3){o.x+=(tx-o.x)/d*42*dt;o.y+=(ty-o.y)/d*42*dt;o.ph+=dt*8;o.face=tx<o.x?-1:1}}
// arrows
s.ar=s.ar.filter(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.l-=dt;for(const e of s.en)if(e.hp>0&&dist(e.x,e.y-e.r,a.x,a.y)<e.r+3){hit(e,a.dmg);return false}return a.l>0});
// enemies
const wallUp=s.wall.hp>0;
for(const e of s.en){if(e.hp<=0)continue;e.fl-=dt;e.ac-=dt;const dc=dist(e.x,e.y,CX,CY);let tx=CX,ty=CY,stop=CASTLE_R+e.r,tgt='castle';
const so=s.sol.find(o=>dist(o.x,o.y,e.x,e.y)<e.r+7);
if(so){tgt=so;tx=so.x;ty=so.y;stop=99}
else if(e.type!=='boss'&&dist(k.x,k.y,e.x,e.y)<45){tgt='king';tx=k.x;ty=k.y;stop=e.r+7}
else if(wallUp&&dc>WALL_R-3){tgt='wall';stop=WALL_R+e.r}
const dd=tgt==='wall'?dc:dist(e.x,e.y,tx,ty);
if(dd>stop){e.x+=(tx-e.x)/dd*e.sp*dt;e.y+=(ty-e.y)/dd*e.sp*dt;e.ph+=dt*e.sp*.25;e.face=tx<e.x?-1:1}
else if(e.ac<=0){e.ac=1;if(tgt==='king'){k.hp-=e.dmg;k.fl=.12}else if(tgt==='castle')s.castle.hp-=e.dmg;else if(tgt==='wall')s.wall.hp-=e.dmg;else{tgt.hp-=e.dmg;tgt.fl=.1}burst(e.x+(tx-e.x)*.3,e.y+(ty-e.y)*.3,'#ff5252',5)}}
for(let i=0;i<s.en.length;i++)for(let j=i+1;j<s.en.length;j++){const a=s.en[i],b=s.en[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,o=a.r+b.r-d;if(o>0){a.x-=dx/d*o*.5;a.y-=dy/d*o*.5;b.x+=dx/d*o*.5;b.y+=dy/d*o*.5}}
s.sol=s.sol.filter(o=>{if(o.hp<=0){burst(o.x,o.y,'#64b5f6',10);return false}return true});
s.en=s.en.filter(e=>{if(e.hp>0)return true;burst(e.x,e.y-e.r,e.type==='boss'?'#ffd740':'#7cb342',e.type==='boss'?40:12,e.type==='boss'?120:60);if(e.type==='boss'){s.shake=.5;pop('BOSS DEFEATED!','#ffd740')}
const n=e.type==='boss'?12:e.g>1?2:1;for(let i=0;i<n;i++){const a=R()*TAU,v=rnd(10,e.type==='boss'?60:25);s.coins.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,z:0,vz:rnd(40,70),v:Math.ceil(e.g/n*(1+s.wave*.08))})}return false});
// coins
s.coins=s.coins.filter(c=>{c.vz-=200*dt;c.z+=c.vz*dt;if(c.z<0){c.z=0;c.vz*=-.45;c.vx*=.6;c.vy*=.6}c.x+=c.vx*dt;c.y+=c.vy*dt;
const d=dist(c.x,c.y,k.x,k.y);if(d<45&&c.z<3){c.x+=(k.x-c.x)/d*220*dt;c.y+=(k.y-c.y)/d*220*dt}
if(d<9){s.gold+=c.v;num(k.x,k.y-26,'+'+c.v,'#ffd740',7);s.hud.push({x:(c.x-s.cam.x)*Z+W/2,y:(c.y-s.cam.y)*Z+H/2,t:0});return false}return true});
s.hud=s.hud.filter(h=>(h.t+=dt*2)<1);
s.pt=s.pt.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;return(p.l-=dt)>0});
s.nums=s.nums.filter(n=>{n.y-=22*dt;return(n.l-=dt)>0});s.pops=s.pops.filter(p=>(p.a+=dt)<1.6);
if(k.hp<=0||s.castle.hp<=0)over()}
// ---------- drawing
const sh=(x,y,rx)=>{X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(x,y,rx,rx*.38,0,0,TAU);X.fill()};
const circ=(x,y,r,c)=>{X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,TAU);X.fill()};
function hbar(x,y,w,f,c){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(x-w/2-.5,y-.5,w+1,3);X.fillStyle=c;X.fillRect(x-w/2,y,w*Math.max(0,f),2)}
function txt(t,x,y,s,c,al='center'){X.font='900 '+s+'px system-ui,sans-serif';X.textAlign=al;X.textBaseline='middle';X.lineWidth=s/4;X.strokeStyle='#000';X.strokeText(t,x,y);X.fillStyle=c;X.fillText(t,x,y)}
function drawKing(k){const b=Math.abs(Math.sin(k.ph))*2.2,sw=Math.sin(k.ph*2)*.6,fl=k.fl>0;sh(k.x,k.y+1,11);X.save();X.translate(k.x,k.y);X.scale(k.face,1);
X.strokeStyle=fl?'#fff':'#5a3515';X.lineWidth=2;X.lineCap='round';[[-6,sw],[-3,-sw],[5,-sw],[8,sw]].forEach(([lx,a])=>{X.beginPath();X.moveTo(lx,-6-b);X.lineTo(lx+a*4,0);X.stroke()});
X.strokeStyle=fl?'#fff':'#3a2210';X.lineWidth=2.4;X.beginPath();X.moveTo(-9,-9-b);X.quadraticCurveTo(-14,-8-b,-13,-2-b+sw);X.stroke();
X.fillStyle=fl?'#fff':'#8b5a2b';X.beginPath();X.ellipse(1,-8-b,10,5,0,0,TAU);X.fill();X.beginPath();X.ellipse(10,-13-b,3.2,5,.5,0,TAU);X.fill();X.beginPath();X.ellipse(13,-16-b,4.2,2.6,.3,0,TAU);X.fill();
X.fillStyle='#3a2210';X.beginPath();X.ellipse(8.5,-15-b,1.5,4,.5,0,TAU);X.fill();circ(14,-17-b,.7,'#000');
