ec[k])for(const G of SECG)if(G.includes(k))for(const o of G)if(o!==k)bsec[o]=0;bsec[k]^=1;localStorage.setItem(SK('kaBsec'),JSON.stringify(bsec));renderMenu();return}if(id==='resume'){UI.style.display='none';state='play';Snd.setPaused(false);lt=performance.now();return}if(id==='wake'){Wake.set(!Wake.on);if(state==='pause')renderMenu();else if(tset)titleSettings();else menu();return}if(id==='pip'){PIP.toggle();return}if(id==='mus'||id==='sfx'){Snd.cfg[id==='mus'?'m':'s']^=1;Snd.save();if(id==='sfx'&&Snd.cfg.s)Snd.ui();if(state==='pause')renderMenu();else if(tset)titleSettings();else menu();return}if(id==='quit'){UI.innerHTML=`<div class="pn"><h1 style="font-size:28px">Abandon Run?</h1><p>Are you sure? (Tip: use 💾 Save &amp; Exit to keep this run.) Your current run will end and its progress will be lost (gems are only awarded when a run ends in defeat).</p><button class="b n" data-id="quitYes">Yes, abandon run</button><button class="b" data-id="quitNo">Cancel</button></div>`;return}if(id==='start')startPick();else if(id==='hs'){localStorage.setItem(SK('kaHS'),localStorage.getItem(SK('kaHS'))==='1'?'0':'1');if(tset)titleSettings();else menu()}else if(id==='sw1'||id==='swm'){const r=document.getElementById('swr');r.value=id==='sw1'?1:r.max;r.oninput()}else if(id==='swgo')newGame(+document.getElementById('swr').value);else if(id==='arm'){ASEC={fav:1};armory()}else if(id==='arts')artifacts();else if(id==='tset')titleSettings();else if(id==='menu')menu();
else if(b.dataset.fav){const k=b.dataset.fav,sc=(wrapUI(),scr()).scrollTop;FAV=FAV.includes(k)?FAV.filter(x=>x!==k):[...FAV,k];localStorage.setItem(SK('kaFav'),JSON.stringify(FAV));armory();(wrapUI(),scr()).scrollTop=sc}
