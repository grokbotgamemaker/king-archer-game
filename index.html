if(s.wave===0&&s.breakT>0){const tw=Math.min(W-30,340);X.fillStyle='rgba(25,15,5,.78)';rr(X,W/2-tw/2,H-78,tw,54,16);X.fill();txt('Stop on a glowing pad to buy upgrades',W/2,H-60,Math.min(15,W/26),'#ffe066');txt('Enemies come from the north — defend the gate!',W/2,H-39,Math.min(12.5,W/31),'#fff')}}
// ---------- screens
function gemsFor(s){const a=s.wave*3,b=s.bosses*15,c=Math.floor(s.kills/8);return{a,b,c,t:a+b+c}}
function over(){state='over';loadMeta();const g=gemsFor(st);meta.gems+=g.t;meta.runs=(meta.runs||0)+1;saveMeta();if(st.wave>best){best=st.wave;localStorage.setItem('kaBest',best)}
UI.innerHTML=`<div class="pn"><h1>${st.k.hp<=0?'The King Has Fallen':'The Castle Fell'}</h1><p>You survived to <b style="color:#ffe066">wave ${st.wave}</b> · 🏆 best ${best}</p>
<h2>💎 Gems Earned</h2><table><tr><td>Waves reached (${st.wave} × 3)</td><td>+${g.a}</td></tr><tr><td>Bosses slain (${st.bosses} × 15)</td><td>+${g.b}</td></tr><tr><td>Kills (${st.kills} ÷ 8)</td><td>+${g.c}</td></tr><tr><td><b>Total</b></td><td><b>+${g.t} 💎</b></td></tr></table>
<div class="gem">💎 ${meta.gems}</div><button class="b" data-id="start">↻ Ride Again</button><button class="b g" data-id="arm">⚔️ Royal Armory</button><button class="b n" data-id="menu">Main Menu</button></div>`;UI.style.display='flex'}
function menu(){state='menu';loadMeta();const rf=meta.refund?`<p style="color:#9ff">Horse upgrades were retired — refunded 💎 ${meta.refund}</p>`:'';if(meta.refund){delete meta.refund;saveMeta()}
UI.innerHTML=`<div class="pn"><div style="font-size:54px;line-height:1">👑</div><h1>King Archer</h1><p>Drag anywhere to ride. Your king fires automatically.</p><p>Enemies march down the roads from the north. Hold your <b style="color:#ffe066">gate</b>, ride out for gold, and stop on <b style="color:#ffe066">glowing pads</b> to build.</p>${rf}
<div><span class="gem">💎 ${meta.gems}</span><span class="gem" style="color:#ffe066">🏆 Wave ${best}</span></div><button class="b" data-id="start">▶ Play</button><button class="b g" data-id="arm">⚔️ Royal Armory</button></div>`;UI.style.display='flex'}
function armory(){loadMeta();UI.innerHTML=`<div class="pn"><h1>Royal Armory</h1><p>Permanent upgrades for every run</p><div class="gem">💎 ${meta.gems}</div>`+ARM.map(a=>{const l=ml(a[0]),mx=l>=a[4],c=armCost(a);
return`<div class="row"><div class="ic">${a[1]}</div><div class="tx"><b>${a[2]}</b><small>${a[3].replace('wall HP','gate HP')}</small>${Array.from({length:a[4]},(_,i)=>`<span class="pip ${i<l?'on':''}"></span>`).join('')}</div><button class="buy" data-buy="${a[0]}" ${mx||meta.gems<c?'disabled':''}>${mx?'MAX':'💎 '+c}</button></div>`}).join('')+
`<button class="b" data-id="start">▶ Play</button><button class="b n" data-id="menu">Back</button></div>`;UI.style.display='flex'}
UI.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id;if(id==='start')newGame();else if(id==='arm')armory();else if(id==='menu')menu();
else if(b.dataset.buy){const a=ARM.find(x=>x[0]===b.dataset.buy),c=armCost(a);if(meta.gems>=c&&ml(a[0])<a[4]){meta.gems-=c;meta.up[a[0]]=ml(a[0])+1;saveMeta();const sc=UI.querySelector('.pn').scrollTop;armory();UI.querySelector('.pn').scrollTop=sc}}});
let lt=performance.now();function loop(t){const dt=Math.min(.05,(t-lt)/1000);lt=t;if(state==='play')upd(dt);if(st)draw();else{X.setTransform(D,0,0,D,0,0);X.fillStyle='#1d3a17';X.fillRect(0,0,W,H)}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
